name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for committed credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 now requires a paid GITLEAKS_LICENSE for private repos.
      # Running the scanner's own open-source image directly (mounted against the checkout
      # done above by the normal runner) avoids that gate without giving up the tool.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
