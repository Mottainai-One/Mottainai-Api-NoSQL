# Modelo de configuração local. NÃO commitar credenciais reais neste arquivo.
# A URI real deve vir da variável de ambiente SPRING_DATA_MONGODB_URI (nunca hardcoded).
#
# Exemplo de URI com autenticação:
#   mongodb://<usuario>:<senha>@127.0.0.1:27017/mottainai?authSource=admin
#
# Para rodar localmente:
#   set SPRING_DATA_MONGODB_URI=mongodb://<usuario>:<senha>@127.0.0.1:27017/mottainai?authSource=admin   (Windows cmd)
#   $env:SPRING_DATA_MONGODB_URI="mongodb://<usuario>:<senha>@127.0.0.1:27017/mottainai?authSource=admin" (PowerShell)
#   export SPRING_DATA_MONGODB_URI="mongodb://<usuario>:<senha>@127.0.0.1:27017/mottainai?authSource=admin" (bash)

server:
  port: 8080

spring:
  application:
    name: mottainai-mongo-api
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://<usuario>:<senha>@127.0.0.1:27017/mottainai?authSource=admin}
      auto-index-creation: false
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
